services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?启动可选的 Compose MySQL 前必须设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: academic_submission_agent
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
